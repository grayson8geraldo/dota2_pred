<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Match Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0e1015;
            color: #c5c8cc;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
            border-bottom: 2px solid #e74c3c;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            color: #e74c3c;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        .header p {
            color: #888;
            font-size: 0.85em;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 4px;
            background: #151921;
            padding: 10px 20px 0;
        }
        .tab {
            padding: 10px 24px;
            background: #1a1f2e;
            border: 1px solid #2a2f3e;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #888;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .tab:hover { color: #ccc; background: #222738; }
        .tab.active {
            background: #1e2433;
            color: #e74c3c;
            border-color: #e74c3c;
            border-bottom: 2px solid #1e2433;
        }
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .card {
            background: #1a1f2e;
            border: 1px solid #2a2f3e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        input, select, button {
            font-family: inherit;
            font-size: 0.95em;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px 14px;
            background: #0e1015;
            border: 1px solid #2a2f3e;
            border-radius: 6px;
            color: #c5c8cc;
            margin-bottom: 10px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #e74c3c;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: #c0392b; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary {
            background: #2a2f3e;
            color: #ccc;
        }
        .btn-secondary:hover { background: #3a3f4e; }
        .row { display: flex; gap: 12px; align-items: end; }
        .row > div { flex: 1; }
        label {
            display: block;
            color: #888;
            font-size: 0.8em;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prediction-result {
            margin-top: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .winner-banner {
            text-align: center;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .winner-banner.high { background: linear-gradient(135deg, #1a4a2e, #0e1015); border: 1px solid #27ae60; }
        .winner-banner.medium { background: linear-gradient(135deg, #4a3a1a, #0e1015); border: 1px solid #f39c12; }
        .winner-banner.low { background: linear-gradient(135deg, #3a1a1a, #0e1015); border: 1px solid #888; }
        .winner-name { font-size: 1.4em; font-weight: 700; color: #fff; }
        .winner-prob { font-size: 1.1em; color: #aaa; margin-top: 4px; }
        .conf-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 8px;
        }
        .conf-HIGH { background: #27ae60; color: #fff; }
        .conf-MEDIUM { background: #f39c12; color: #fff; }
        .conf-LOW { background: #555; color: #ccc; }
        .prob-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }
        .prob-bar-label { width: 120px; text-align: right; font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prob-bar-track { flex: 1; height: 24px; background: #0e1015; border-radius: 4px; overflow: hidden; }
        .prob-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .prob-bar-fill.radiant { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .prob-bar-fill.dire { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .prob-bar-pct { width: 50px; font-size: 0.85em; font-weight: 600; }
        .factors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .factor { padding: 8px 12px; background: #0e1015; border-radius: 6px; font-size: 0.8em; }
        .factor-label { color: #888; font-size: 0.75em; text-transform: uppercase; }
        .factor-value { color: #ccc; margin-top: 2px; }
        .match-card {
            padding: 12px 16px;
            background: #0e1015;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .match-card:hover { border-color: #2a2f3e; background: #151921; }
        .match-teams { font-size: 0.9em; }
        .match-teams strong { color: #fff; }
        .match-meta { text-align: right; font-size: 0.8em; }
        .match-winner { color: #27ae60; font-weight: 600; }
        .league-header { color: #e74c3c; font-size: 0.85em; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #2a2f3e; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #555; border-top-color: #e74c3c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #e74c3c; padding: 12px; background: #2a1a1a; border-radius: 6px; margin-top: 12px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-box { background: #0e1015; border-radius: 6px; padding: 14px; text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.75em; color: #888; text-transform: uppercase; margin-top: 4px; }
        .stat-value.green { color: #27ae60; }
        .stat-value.yellow { color: #f39c12; }
        .stat-value.red { color: #e74c3c; }
        table.data-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        table.data-table th { text-align: left; color: #888; padding: 8px; border-bottom: 1px solid #2a2f3e; font-size: 0.8em; text-transform: uppercase; }
        table.data-table td { padding: 8px; border-bottom: 1px solid #1a1f2e; }
        .status-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7em; font-weight: 600; }
        .status-UPCOMING { background: #2a3f5e; color: #5dade2; }
        .status-TODAY { background: #2a4a2e; color: #27ae60; }
    </style>
</head>
<body>
    <div class="header">
        <h1>DOTA 2 MATCH PREDICTOR</h1>
        <p>Pre-match predictions powered by ML ensemble (LightGBM + LR)</p>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="predict">Predict Match</div>
        <div class="tab" data-tab="today">Today's Matches</div>
        <div class="tab" data-tab="team">Team Lookup</div>
        <div class="tab" data-tab="accuracy">Accuracy</div>
    </div>

    <div class="content">
        <!-- Predict Match Panel -->
        <div class="panel active" id="panel-predict">
            <div class="card">
                <div class="row">
                    <div>
                        <label>Radiant Team</label>
                        <input type="text" id="radiant-input" placeholder="e.g. Team Spirit">
                    </div>
                    <div>
                        <label>Dire Team</label>
                        <input type="text" id="dire-input" placeholder="e.g. Tundra Esports">
                    </div>
                    <div style="flex:0.5">
                        <label>Format</label>
                        <select id="format-select">
                            <option value="BO3" selected>BO3</option>
                            <option value="BO1">BO1</option>
                            <option value="BO5">BO5</option>
                            <option value="BO2">BO2</option>
                        </select>
                    </div>
                </div>
                <button class="btn" id="predict-btn" onclick="predictMatch()">Predict</button>
            </div>
            <div id="predict-result"></div>
        </div>

        <!-- Today's Matches Panel -->
        <div class="panel" id="panel-today">
            <div class="card">
                <div class="row">
                    <div>
                        <label>Min Team Rating</label>
                        <input type="text" id="today-rating" placeholder="1100 (default)" value="">
                    </div>
                    <div style="flex:0.5">
                        <button class="btn" onclick="loadToday()">Load Matches</button>
                    </div>
                    <div style="flex:0.5">
                        <button class="btn btn-secondary" onclick="loadToday(true)">Show All</button>
                    </div>
                </div>
            </div>
            <div id="today-result"></div>
        </div>

        <!-- Team Lookup Panel -->
        <div class="panel" id="panel-team">
            <div class="card">
                <div class="row">
                    <div>
                        <label>Team Name</label>
                        <input type="text" id="team-input" placeholder="e.g. Gaimin Gladiators">
                    </div>
                    <div style="flex:0.3">
                        <button class="btn" onclick="lookupTeam()">Search</button>
                    </div>
                </div>
            </div>
            <div id="team-result"></div>
        </div>

        <!-- Accuracy Panel -->
        <div class="panel" id="panel-accuracy">
            <div class="card">
                <div class="row">
                    <div>
                        <label>Period (days)</label>
                        <select id="accuracy-days">
                            <option value="7">Last 7 days</option>
                            <option value="14">Last 14 days</option>
                            <option value="30" selected>Last 30 days</option>
                            <option value="90">Last 90 days</option>
                        </select>
                    </div>
                    <div style="flex:0.3">
                        <button class="btn" onclick="loadAccuracy()">Refresh</button>
                    </div>
                </div>
            </div>
            <div id="accuracy-result">
                <div class="loading">Select a period and click Refresh to load accuracy data.</div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        // Enter key triggers predict
        ['radiant-input', 'dire-input'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', e => {
                if (e.key === 'Enter') predictMatch();
            });
        });
        document.getElementById('team-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') lookupTeam();
        });

        async function predictMatch() {
            const radiant = document.getElementById('radiant-input').value.trim();
            const dire = document.getElementById('dire-input').value.trim();
            const format = document.getElementById('format-select').value;
            const resultDiv = document.getElementById('predict-result');

            if (!radiant || !dire) {
                resultDiv.innerHTML = '<div class="error">Enter both team names.</div>';
                return;
            }

            const btn = document.getElementById('predict-btn');
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading"><span class="spinner"></span>Analyzing teams...</div>';

            try {
                const resp = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({radiant, dire, format})
                });
                const data = await resp.json();
                if (data.error) {
                    resultDiv.innerHTML = '<div class="error">' + data.error + '</div>';
                } else {
                    resultDiv.innerHTML = renderPrediction(data);
                }
            } catch (err) {
                resultDiv.innerHTML = '<div class="error">Request failed: ' + err.message + '</div>';
            }
            btn.disabled = false;
        }

        function renderPrediction(d) {
            const confClass = d.confidence;
            const radPct = (d.radiant_win_prob * 100).toFixed(1);
            const direPct = (d.dire_win_prob * 100).toFixed(1);
            const bd = d.breakdown || {};
            const tr = bd.team_ratings || {};
            const rf = bd.recent_form || {};
            const h2h = bd.h2h || {};
            const ps = bd.player_strength || {};
            const df = bd.data_freshness || {};

            return '<div class="prediction-result">' +
                '<div class="winner-banner ' + confClass.toLowerCase() + '">' +
                    '<div class="winner-name">' + d.predicted_winner +
                        ' <span class="conf-badge conf-' + confClass + '">' + confClass + '</span></div>' +
                    '<div class="winner-prob">' + (d.win_probability * 100).toFixed(1) + '% win probability &mdash; ' + d.series_format + ' &mdash; ' + d.model_type + '</div>' +
                '</div>' +
                '<div class="card">' +
                    '<div class="prob-bar-container">' +
                        '<div class="prob-bar-label">' + d.radiant_team + '</div>' +
                        '<div class="prob-bar-track"><div class="prob-bar-fill radiant" style="width:' + radPct + '%"></div></div>' +
                        '<div class="prob-bar-pct">' + radPct + '%</div>' +
                    '</div>' +
                    '<div class="prob-bar-container">' +
                        '<div class="prob-bar-label">' + d.dire_team + '</div>' +
                        '<div class="prob-bar-track"><div class="prob-bar-fill dire" style="width:' + direPct + '%"></div></div>' +
                        '<div class="prob-bar-pct">' + direPct + '%</div>' +
                    '</div>' +
                '</div>' +
                '<div class="card"><label>Key Factors</label><div class="factors">' +
                    '<div class="factor"><div class="factor-label">Ratings</div><div class="factor-value">Rad: ' + (tr.radiant || 'N/A') + ' / Dire: ' + (tr.dire || 'N/A') + ' (Elo: ' + (tr.elo_win_prob || 'N/A') + ')</div></div>' +
                    '<div class="factor"><div class="factor-label">Recent Form</div><div class="factor-value">Rad: ' + (rf.radiant_winrate || 'N/A') + ' / Dire: ' + (rf.dire_winrate || 'N/A') + '</div></div>' +
                    '<div class="factor"><div class="factor-label">Momentum (5g)</div><div class="factor-value">Rad: ' + (rf.radiant_momentum || 'N/A') + ' / Dire: ' + (rf.dire_momentum || 'N/A') + '</div></div>' +
                    '<div class="factor"><div class="factor-label">Head-to-Head</div><div class="factor-value">' + (h2h.games || 0) + ' games (Rad WR: ' + (h2h.radiant_winrate || 'N/A') + ')</div></div>' +
                    '<div class="factor"><div class="factor-label">Player WR</div><div class="factor-value">Rad: ' + (ps.radiant_wr || 'N/A') + ' / Dire: ' + (ps.dire_wr || 'N/A') + '</div></div>' +
                    '<div class="factor"><div class="factor-label">Hero Pool</div><div class="factor-value">Rad: ' + (ps.rad_hero_pool || 'N/A') + ' / Dire: ' + (ps.dire_hero_pool || 'N/A') + '</div></div>' +
                    '<div class="factor"><div class="factor-label">Data Age</div><div class="factor-value">Rad: ' + (df.radiant || '?') + ' / Dire: ' + (df.dire || '?') + '</div></div>' +
                '</div></div></div>';
        }

        async function loadToday(showAll) {
            const resultDiv = document.getElementById('today-result');
            const minRating = document.getElementById('today-rating').value.trim();
            resultDiv.innerHTML = '<div class="loading"><span class="spinner"></span>Loading today\'s matches...</div>';

            let url = '/api/today?';
            if (showAll) url += 'all=1&';
            if (minRating) url += 'min_rating=' + minRating + '&';

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (!data.length) {
                    resultDiv.innerHTML = '<div class="card"><p>No matches found for today. Try lowering the rating filter or using "Show All".</p></div>';
                    return;
                }

                const byLeague = {};
                data.forEach(function(p) {
                    const lg = p.league || 'Unknown';
                    if (!byLeague[lg]) byLeague[lg] = [];
                    byLeague[lg].push(p);
                });

                let html = '';
                const total = data.length;
                const high = data.filter(function(p) { return p.confidence === 'HIGH'; }).length;
                const med = data.filter(function(p) { return p.confidence === 'MEDIUM'; }).length;
                html += '<div class="card"><strong>' + total + '</strong> matches &mdash; <span style="color:#27ae60">' + high + ' high</span> / <span style="color:#f39c12">' + med + ' medium</span> / ' + (total - high - med) + ' low confidence</div>';

                for (const league in byLeague) {
                    const preds = byLeague[league];
                    html += '<div class="league-header">' + league + '</div>';
                    preds.forEach(function(p) {
                        const statusClass = p.status || '';
                        html += '<div class="match-card" onclick="quickPredict(\'' + p.radiant_team.replace(/'/g, "\\'") + '\',\'' + p.dire_team.replace(/'/g, "\\'") + '\')">' +
                            '<div class="match-teams"><strong>' + p.radiant_team + '</strong> vs <strong>' + p.dire_team + '</strong> <span class="status-tag status-' + statusClass + '">' + statusClass + '</span></div>' +
                            '<div class="match-meta"><div class="match-winner">' + p.predicted_winner + ' (' + (p.win_probability*100).toFixed(1) + '%)</div><span class="conf-badge conf-' + p.confidence + '">' + p.confidence + '</span></div></div>';
                    });
                }
                resultDiv.innerHTML = html;
            } catch (err) {
                resultDiv.innerHTML = '<div class="error">Failed to load: ' + err.message + '</div>';
            }
        }

        function quickPredict(rad, dire) {
            document.getElementById('radiant-input').value = rad;
            document.getElementById('dire-input').value = dire;
            document.querySelector('[data-tab="predict"]').click();
            predictMatch();
        }

        async function lookupTeam() {
            const name = document.getElementById('team-input').value.trim();
            const resultDiv = document.getElementById('team-result');
            if (!name) { resultDiv.innerHTML = '<div class="error">Enter a team name.</div>'; return; }
            resultDiv.innerHTML = '<div class="loading"><span class="spinner"></span>Searching...</div>';

            try {
                const resp = await fetch('/api/team?name=' + encodeURIComponent(name));
                const data = await resp.json();
                if (data.error) {
                    resultDiv.innerHTML = '<div class="error">' + data.error + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="card"><h3 style="color:#fff;margin-bottom:12px">' + data.name + ' <span style="color:#888">[' + data.tag + ']</span></h3>' +
                        '<div class="stat-grid">' +
                            '<div class="stat-box"><div class="stat-value">' + (data.rating || 'N/A') + '</div><div class="stat-label">Rating</div></div>' +
                            '<div class="stat-box"><div class="stat-value green">' + (data.wins || 0) + '</div><div class="stat-label">Wins</div></div>' +
                            '<div class="stat-box"><div class="stat-value red">' + (data.losses || 0) + '</div><div class="stat-label">Losses</div></div>' +
                            '<div class="stat-box"><div class="stat-value">' + (data.winrate ? (data.winrate * 100).toFixed(1) + '%' : 'N/A') + '</div><div class="stat-label">Win Rate</div></div>' +
                        '</div>' +
                        '<p style="color:#888;font-size:0.8em">Team ID: ' + data.team_id + '</p></div>';
                }
            } catch (err) {
                resultDiv.innerHTML = '<div class="error">Request failed: ' + err.message + '</div>';
            }
        }

        async function loadAccuracy() {
            const days = document.getElementById('accuracy-days').value;
            const resultDiv = document.getElementById('accuracy-result');
            resultDiv.innerHTML = '<div class="loading"><span class="spinner"></span>Loading accuracy data...</div>';

            try {
                const resp = await fetch('/api/accuracy?days=' + days);
                const data = await resp.json();
                const s = data.stats || {};
                const drift = data.drift || {};

                let accColor = 'green';
                if (s.accuracy !== null && s.accuracy < 0.6) accColor = 'yellow';
                if (s.accuracy !== null && s.accuracy < 0.52) accColor = 'red';

                let html = '';

                if (drift.detected) {
                    html += '<div class="card" style="border-color:#e74c3c;background:#2a1a1a"><strong style="color:#e74c3c">Drift Detected:</strong> ' + drift.reason + '<br><span style="color:#888;font-size:0.85em">Consider retraining: python main.py train --matches 1500</span></div>';
                }

                html += '<div class="stat-grid">' +
                    '<div class="stat-box"><div class="stat-value">' + (s.total_predictions || 0) + '</div><div class="stat-label">Total</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + (s.resolved || 0) + '</div><div class="stat-label">Resolved</div></div>' +
                    '<div class="stat-box"><div class="stat-value ' + accColor + '">' + (s.accuracy !== null ? (s.accuracy * 100).toFixed(1) + '%' : 'N/A') + '</div><div class="stat-label">Accuracy</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + (s.brier_score !== null ? s.brier_score.toFixed(4) : 'N/A') + '</div><div class="stat-label">Brier Score</div></div></div>';

                if (s.by_confidence && s.by_confidence.length) {
                    html += '<div class="card"><label>By Confidence Level</label><table class="data-table"><tr><th>Level</th><th>Predictions</th><th>Resolved</th><th>Accuracy</th></tr>';
                    s.by_confidence.forEach(function(c) {
                        const acc = c.accuracy !== null ? (c.accuracy * 100).toFixed(1) + '%' : 'N/A';
                        html += '<tr><td><span class="conf-badge conf-' + c.confidence + '">' + c.confidence + '</span></td><td>' + c.total + '</td><td>' + c.resolved + '</td><td>' + acc + '</td></tr>';
                    });
                    html += '</table></div>';
                }

                const trend = s.trend || {};
                if (trend.last_7d !== null || trend.prev_7d !== null) {
                    const l7 = trend.last_7d !== null ? (trend.last_7d * 100).toFixed(1) + '%' : 'N/A';
                    const p7 = trend.prev_7d !== null ? (trend.prev_7d * 100).toFixed(1) + '%' : 'N/A';
                    html += '<div class="card"><label>Trend</label><div class="stat-grid">' +
                        '<div class="stat-box"><div class="stat-value">' + l7 + '</div><div class="stat-label">Last 7 Days</div></div>' +
                        '<div class="stat-box"><div class="stat-value">' + p7 + '</div><div class="stat-label">Previous 7 Days</div></div></div></div>';
                }

                var recent = data.recent_predictions || [];
                if (recent.length) {
                    html += '<div class="card"><label>Recent Predictions</label><table class="data-table"><tr><th>Result</th><th>Match</th><th>Prediction</th><th>Confidence</th><th>Date</th></tr>';
                    recent.forEach(function(p) {
                        var statusIcon = '?', statusColor = '#888';
                        if (p.correct === 1) { statusIcon = 'Y'; statusColor = '#27ae60'; }
                        else if (p.correct === 0) { statusIcon = 'N'; statusColor = '#e74c3c'; }
                        var dt = p.predicted_at ? p.predicted_at.substring(0, 16) : '';
                        html += '<tr><td style="color:' + statusColor + ';font-weight:700">' + statusIcon + '</td><td>' + p.radiant_team + ' vs ' + p.dire_team + '</td><td>' + p.predicted_winner + '</td><td><span class="conf-badge conf-' + p.confidence + '">' + p.confidence + '</span></td><td style="color:#888;font-size:0.8em">' + dt + '</td></tr>';
                    });
                    html += '</table></div>';
                }

                var models = data.model_history || [];
                if (models.length) {
                    html += '<div class="card"><label>Training History</label><table class="data-table"><tr><th>Date</th><th>Samples</th><th>CV Accuracy</th><th>Brier</th><th>Validation</th></tr>';
                    models.forEach(function(m) {
                        var dt = m.trained_at ? m.trained_at.substring(0, 16) : '';
                        var cv = m.cv_accuracy !== null ? (m.cv_accuracy * 100).toFixed(1) + '%' : 'N/A';
                        var brier = m.brier_score !== null ? m.brier_score.toFixed(4) : 'N/A';
                        html += '<tr><td style="font-size:0.8em">' + dt + '</td><td>' + (m.n_samples || 'N/A') + '</td><td>' + cv + '</td><td>' + brier + '</td><td>' + (m.validation_type || 'N/A') + '</td></tr>';
                    });
                    html += '</table></div>';
                }

                resultDiv.innerHTML = html || '<div class="card"><p>No accuracy data available yet. Make some predictions first.</p></div>';
            } catch (err) {
                resultDiv.innerHTML = '<div class="error">Failed to load: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
